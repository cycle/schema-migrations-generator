---

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - 2.x
  pull_request: null

name: build

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Unit tests and the SQLite driver tests; MySQL, Postgres and MSSQL run in their own workflows.
    name: PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: ['lowest', 'highest']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          extensions: mbstring, pdo, pdo_sqlite

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Execute Tests
        env:
          DB_DRIVERS: sqlite
          DB_REQUIRED: 1
        run: composer test -- --coverage-clover=coverage.clover

      - name: Upload coverage to Codecov
        if: matrix.php == '8.4' && matrix.dependencies == 'highest'
        continue-on-error: true # if is fork
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.clover
